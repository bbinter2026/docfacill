<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#0f1f26;--mu:#5b6b75;--bd:#d9e2e7;--ac:#0f9e8e;--act:#fff;--dg:#dc2626;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07141a;--card:#132b35;--tx:#f3f4f6;--mu:#9ca3af;--bd:#21464f;--ac:#2dd4bf;--act:#04201c;--in:#1a3a47}}
:root[data-theme="dark"]{--bg:#07141a;--card:#132b35;--tx:#f3f4f6;--mu:#9ca3af;--bd:#21464f;--ac:#2dd4bf;--act:#04201c;--in:#1a3a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:980px;margin:auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
h1{font-size:1.2rem;margin:0}h1 span{color:var(--ac)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mu);padding:9px 2px;border-radius:9px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs .on{background:var(--ac);color:var(--act);font-weight:600}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.b{background:var(--ac);color:var(--act);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.b:disabled{opacity:.5;cursor:default}.b.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--dg);color:#fff}.b.m{padding:5px 9px;font-size:.78rem}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit}
label{display:block;font-size:.78rem;color:var(--mu)}label input,label select,label textarea{margin-top:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k .cd{margin:0}.k b{font-size:1.05rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.ac{display:flex;gap:5px;flex-wrap:wrap}small,.mu{color:var(--mu)}
.bd{font-size:.68rem;padding:2px 7px;border-radius:99px;background:var(--ac);color:var(--act);font-weight:700}
.st{font-size:.72rem;color:var(--mu)}
#mo,#mo2{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:120;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.md{background:var(--card);border-radius:16px;width:100%;max-width:860px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh,.mf{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.mh{border-bottom:1px solid var(--bd)}
.mf{gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}.mb{padding:14px;overflow:auto}
.x{background:none;border:0;color:var(--tx);font-size:1.15rem;cursor:pointer;padding:4px 8px}
.itr{display:grid;grid-template-columns:1fr 62px 92px 30px;gap:6px;margin-bottom:6px}
#tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:130;font-size:.85rem}
.sh{width:210mm;min-height:297mm;background:#ececed;color:#222;display:flex;flex-direction:column;font:11pt/1.45 system-ui,sans-serif;margin:auto;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hw{position:relative;height:50mm;flex:none}.hw svg{position:absolute;inset:0;width:100%;height:100%}
.ht{position:absolute;left:14mm;right:14mm;top:7mm;display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;color:#fff}
.hs{font-size:8.5pt;color:#ddd;line-height:1.35}.am2{color:#f0b942}
.bw{flex:1;display:flex;flex-direction:column;padding:0 14mm 12mm}
.tt{font-size:25pt;font-weight:300;letter-spacing:5px;line-height:1.1;color:#222}
.sb{font-size:8.5pt;color:#666}
.tl{display:flex;justify-content:space-between;padding:2px 8px;font-size:10pt}
.gt{display:flex;justify-content:space-between;background:#f0b942;color:#222;font-weight:700;padding:7px 8px;margin-top:3px}
.sh table{width:100%;border-collapse:collapse}
.sh th{background:#2d2d30;color:#fff;padding:7px 6px;font-size:10pt;text-align:center}.sh th.am{background:#f0b942;color:#222;text-align:left;padding-left:10px;width:44%}
.sh td{padding:7px 6px;text-align:center;font-size:10pt}.sh td:first-child{text-align:left;padding-left:10px}.sh tr:nth-child(even) td{background:#e0e0e1}.sh tr:nth-child(odd) td{background:#e7e7e8}
.sh .pw{white-space:pre-wrap}
.sg{display:flex;gap:25mm;margin-top:auto;padding-top:10mm}.sc{flex:1;text-align:center;font-size:10pt}.sl{height:18mm;display:flex;align-items:flex-end;justify-content:center}.sl img{max-height:17mm;max-width:100%}.sn{border-top:1px solid #333;padding-top:4px}.sh tr,.sg{break-inside:avoid}
.ft{margin-top:6mm;font-size:9.5pt;color:#555}
#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}#lk[hidden]{display:none}
.sh.az,.sh.mn{background:#fff}.sh .g8{font-size:9pt;color:#666}.sh .g9{font-size:10pt;color:#555}.sh .sb{font-size:8.5pt;color:#888}
.az .azh{position:relative;flex:none}.az .bg{position:absolute;inset:0;width:100%;height:100%}.az .azi{position:relative;padding:12mm 14mm 0}

.az .azt{font-size:28pt;font-weight:700;color:#4f81c3;line-height:1.05}.az .r2{display:flex;justify-content:space-between;gap:8mm;margin-top:14mm}
.az .azb{display:flex;justify-content:space-between;align-items:center;border:2px solid #5b8fd0;background:#5b8fd0;color:#fff;padding:2mm 3mm;font-size:9pt}.az .azb b{font-size:13pt}

.az .sg{padding:0 14mm;margin-bottom:8mm}.az .azf{position:relative;height:70mm;flex:none;color:#fff}.az .azx{position:relative;padding:40mm 14mm 0;display:flex;gap:10mm;font-size:9pt}.az .azx>div{flex:1}.az .azx b{font-size:10.5pt}

const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='docfacil1',TY={COT:{n:'Cotação'},FAT:{n:'Factura'},REC:{n:'Recibo'},CTR:{n:'Contrato'}};

const uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=s=>s?s.split('-').reverse().join('/'):'',m=n=>(+n||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+S.cfg.cur;
const nextNo=t=>{const y=new Date().getFullYear();return t+'-'+y+'/'+String((S.seq[t+y]||0)+1).padStart(4,'0')};
function toast(t){let e=$('#tt');e&&e.remove();e=document.createElement('div');e.id='tt';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'],T=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function n3(n){if(n==100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r)p.push(r<20?U[r]:T[Math.floor(r/10)]+(r%10?' e '+U[r%10]:''));return p.join(' e ')}
function ext(v){const n=Math.floor(v),ct=Math.round((v-n)*100),M=Math.floor(n/1e6),k=Math.floor(n%1e6/1e3),r=n%1000,p=[];if(M)p.push(n3(M)+(M==1?' milhão':' milhões'));if(k)p.push(k==1?'mil':n3(k)+' mil');if(r)p.push(n3(r));let s=(p.join(' e ')||'zero')+(n==1?' metical':' meticais');if(ct)s+=' e '+n3(ct)+(ct==1?' centavo':' centavos');return s}
const TPL=[{t:'Contrato de Prestação de Serviços',b:`Entre {{EMISSOR}}, doravante PRIMEIRO OUTORGANTE, e {{CLIENTE}}, doravante SEGUNDO OUTORGANTE, é celebrado o presente contrato de prestação de serviços, que se rege pelas cláusulas seguintes:

{t:'Contrato de Arrendamento',b:`Entre {{EMISSOR}}, doravante SENHORIO, e {{CLIENTE}}, doravante ARRENDATÁRIO, é celebrado o presente contrato de arrendamento:

Cláusula 3.ª (Duração)

É competente o foro da comarca de {{CIDADE}}.

Feito em {{CIDADE}}, aos {{DATA}}, em dois exemplares.`},

________________

let mid;
if(ct)mid=`<h3 style="text-align:center;margin:0 0 4mm;letter-spacing:1px">${E(d.title).toUpperCase()}</h3><div class="pw" style="text-align:justify">${fill(E(d.body))}</div>`;

const lst=()=>{const s=q.toLowerCase();return S.docs.filter(d=>(flt=='ALL'||d.t==flt)&&(d.no+' '+d.cn).toLowerCase().includes(s)).map(row).join('')||'<p class="mu">Nenhum documento.</p>'};
function vDocs(){return`<div class="cd"><div class="g"><input placeholder="Pesquisar por número ou cliente" value="${E(q)}" oninput="q=this.value;$('#lst').innerHTML=lst()"><select onchange="flt=this.value;$('#lst').innerHTML=lst()"><option value="ALL">Todos os tipos</option>${Object.keys(TY).map(t=>`<option value="${t}"${flt==t?' selected':''}>${TY[t].n}</option>`).join('')}</select></div><div id="lst">${lst()}</div></div>`}
function nw(){modal('Novo documento',`<div class="g">${Object.keys(TY).map(t=>`<button class="b" onclick="nd('${t}')">${TY[t].n}</button>`).join('')}</div>`,{cl:'Fechar'})}
function nd(t){openDoc({id:uid(),t,no:nextNo(t),date:today(),due:'',cn:'',cnu:'',cad:'',ctl:'',items:[{d:'',q:1,p:0}],dc:0,iva:S.cfg.iva,tn:'IVA',ex:false,tm:+S.cfg.iva?'tax':'none',obs:'',pago:false,pay:'Numerário',ref:'',title:TPL[0].t,body:TPL[0].b,val:0,city:S.cfg.cid},true)}
const ed=id=>openDoc(S.docs.find(x=>x.id==id),false);
function conv(id){const d=S.docs.find(x=>x.id==id),t=d.t=='COT'?'FAT':'REC',n=JSON.parse(JSON.stringify(d));Object.assign(n,{id:uid(),t,ref:d.no,date:today(),pago:t=='REC',no:nextNo(t)});openDoc(n,true)}
function del(id){modal('Eliminar','Eliminar este documento?',{ok:()=>{S.docs=S.docs.filter(x=>x.id!=id);save();render()},lb:'Eliminar'})}
function itRows(){$('#it').innerHTML=W.items.map((r,i)=>`<div class="itr"><input placeholder="Descrição | detalhe (opcional)" value="${E(r.d)}" oninput="W.items[${i}].d=this.value"><input type="number" min="0" step="any" placeholder="Qtd" aria-label="Quantidade" value="${r.q}" oninput="W.items[${i}].q=this.value;sm()"><input type="number" min="0" step="any" placeholder="Preço" aria-label="Preço" value="${r.p}" oninput="W.items[${i}].p=this.value;sm()"><button class="x" onclick="W.items.splice(${i},1);if(!W.items.length)W.items.push({d:'',q:1,p:0});itRows()" aria-label="Remover">✕</button></div>`).join('');sm()}
function sm(){const k=calc(W);$('#sm').innerHTML='Subtotal '+m(k.sub)+(tm(W)=='ex'?' · '+E(W.tn||'IVA')+' Isento':tm(W)=='tax'?' · '+E(W.tn||'IVA')+' '+m(k.iva):'')+' · <b>Total '+m(k.tot)+'</b>'}
let WN=false;
function fatSel(){const fs=S.docs.filter(x=>x.t=='FAT').sort((a,b)=>(a.pago?1:0)-(b.pago?1:0)),has=fs.some(x=>x.no==W.ref);return`<label>Factura a pagar<select id="f_ref" onchange="pickFat(this.value)"><option value="">— Escolher factura —</option>${fs.map(x=>`<option value="${E(x.no)}"${W.ref==x.no?' selected':''}>${E(x.no)} · ${E(x.cn)} · ${m(calc(x).tot)} · ${x.pago?'Paga':'Pendente'}</option>`).join('')}${W.ref&&!has?`<option value="${E(W.ref)}" selected>${E(W.ref)}</option>`:''}</select></label>`}
function pickFat(v){const X=gd(false),f=S.docs.find(x=>x.t=='FAT'&&x.no==v);X.ref=v;if(f){const c=JSON.parse(JSON.stringify(f));Object.assign(X,{cn:c.cn,cnu:c.cnu,cad:c.cad,ctl:c.ctl,items:c.items,dc:c.dc,tm:c.tm,ex:c.ex,iva:c.iva,tn:c.tn})}openDoc(X,WN)}
function openDoc(d,isNew){WN=isNew;W=JSON.parse(JSON.stringify(d));const ct=W.t=='CTR',t=W.t;
const lbl=(l,id,v,x='')=>`<label>${l}<input id="${id}" value="${E(v)}" ${x}></label>`;
modal((isNew?'Novo ':'Editar ')+TY[t].n+' · '+W.no,`<datalist id="cl">${S.cli.map(c=>`<option value="${E(c.n)}">`).join('')}</datalist>
<div class="g">${lbl('Data','f_date',W.date,'type="date"')}${t=='REC'?fatSel():ct?lbl('Cidade','f_city',W.city):lbl(t=='COT'?'Válida até':'Vencimento','f_due',W.due,'type="date"')}</div>
<div class="g">${lbl('Cliente / Outorgante','f_cn',W.cn,'list="cl" onchange="fc(this.value)"')}${lbl('NUIT','f_cnu',W.cnu)}${lbl('Endereço','f_cad',W.cad)}${lbl('Telefone','f_ctl',W.ctl)}</div>
${ct?`<div class="g"><label>Modelo<select id="f_mod" onchange="$('#f_title').value=TPL[this.value].t;$('#f_body').value=TPL[this.value].b">${TPL.map((x,i)=>`<option value="${i}">${x.t}</option>`).join('')}</select></label>${lbl('Título','f_title',W.title)}${lbl('Valor do contrato','f_val',W.val,'type="number" min="0" step="any"')}</div>

 return new Blob(parts,{type:'application/pdf'});
}
let PC={};
function prep(d){PC={id:d.id,f:null,p:mkPdf(d).then(b=>PC.f=new File([b],pdfName(d),{type:'application/pdf'}))};PC.p.catch(()=>{})}
function shareDoc(id){
 const d=S.docs.find(x=>x.id==id);if(!d)return;prep(d);
 modal('Partilhar · '+E(d.no),'<p class="mu" style="font-size:.85rem;margin-top:0">O documento é enviado em PDF. No telemóvel abre a lista de partilha; no computador o PDF é descarregado para anexar.</p><div style="display:grid;gap:8px"><button class="b" onclick="doShare(\''+id+'\',\'wa\')">💬 WhatsApp</button><button class="b" onclick="doShare(\''+id+'\',\'em\')">✉️ Email</button><button class="b" onclick="doShare(\''+id+'\',\'dl\')">⬇️ Baixar PDF</button></div>',{cl:'Fechar'});
}
function dlFile(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)}
async function doShare(id,how){
 const d=S.docs.find(x=>x.id==id);if(!d)return;
 let f;try{if(PC.id!=id)prep(d);f=PC.f||await PC.p}catch(e){toast('Não foi possível gerar o PDF. Use Ver › Imprimir / PDF.');return}
 if(how=='dl'){dlFile(f);toast('PDF descarregado: '+f.name);return}
 const t=TY[d.t].n+' '+d.no,ln=(d.cn?'Para: '+d.cn+'\n':'')+(d.t!='CTR'||+d.val?'Total: '+m(calc(d).tot)+'\n':''),from=S.cfg.n?'\n'+S.cfg.n:'';
 const txt='Olá, segue em anexo: '+t+'.\n'+ln+'Obrigado.'+from;
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:t,text:txt});return}catch(e){if(e&&e.name=='AbortError')return}}
 dlFile(f);
 if(how=='wa'){let n=(d.ctl||'').replace(/\D/g,'');if(n.length==9&&n[0]=='8')n='258'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(txt),'_blank')}
 else location.href='mailto:?subject='+encodeURIComponent(t+(S.cfg.n?' – '+S.cfg.n:''))+'&body='+encodeURIComponent(txt);
 toast('PDF descarregado: anexe-o à mensagem');
}
lock();render();adsSync();
