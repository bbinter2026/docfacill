<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#0f1f26;--mu:#5b6b75;--bd:#d9e2e7;--ac:#0f9e8e;--act:#fff;--dg:#dc2626;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07141a;--card:#132b35;--tx:#f3f4f6;--mu:#9ca3af;--bd:#21464f;--ac:#2dd4bf;--act:#04201c;--in:#1a3a47}}
:root[data-theme="dark"]{--bg:#07141a;--card:#132b35;--tx:#f3f4f6;--mu:#9ca3af;--bd:#21464f;--ac:#2dd4bf;--act:#04201c;--in:#1a3a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:980px;margin:auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
h1{font-size:1.2rem;margin:0}h1 span{color:var(--ac)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mu);padding:9px 2px;border-radius:9px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs .on{background:var(--ac);color:var(--act);font-weight:600}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.b{background:var(--ac);color:var(--act);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--dg);color:#fff}.b.m{padding:5px 9px;font-size:.78rem}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit}
label{display:block;font-size:.78rem;color:var(--mu)}label input,label select,label textarea{margin-top:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k .cd{margin:0}.k b{font-size:1.05rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.ac{display:flex;gap:5px;flex-wrap:wrap}small,.mu{color:var(--mu)}
.bd{font-size:.68rem;padding:2px 7px;border-radius:99px;background:var(--ac);color:var(--act);font-weight:700}
.st{font-size:.72rem;color:var(--mu)}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.md{background:var(--card);border-radius:16px;width:100%;max-width:860px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh,.mf{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.mh{border-bottom:1px solid var(--bd)}
.mf{gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}.mb{padding:14px;overflow:auto}
.x{background:none;border:0;color:var(--tx);font-size:1.15rem;cursor:pointer;padding:4px 8px}
.itr{display:grid;grid-template-columns:1fr 62px 92px 30px;gap:6px;margin-bottom:6px}
#tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:99;font-size:.85rem}
.sh{width:210mm;min-height:297mm;background:#ececed;color:#222;display:flex;flex-direction:column;font:10pt/1.4 system-ui,sans-serif;margin:auto;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hw{position:relative;height:50mm;flex:none}.hw svg{position:absolute;inset:0;width:100%;height:100%}
.ht{position:absolute;left:14mm;right:14mm;top:7mm;display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;color:#fff}
.hs{font-size:7.5pt;color:#ddd;line-height:1.35}.am2{color:#f0b942}
.bw{flex:1;display:flex;flex-direction:column;padding:0 14mm 12mm}
.tt{font-size:25pt;font-weight:300;letter-spacing:5px;line-height:1.1;color:#222}
.sb{font-size:7.5pt;color:#666}
.tl{display:flex;justify-content:space-between;padding:2px 8px;font-size:9pt}
.gt{display:flex;justify-content:space-between;background:#f0b942;color:#222;font-weight:700;padding:7px 8px;margin-top:3px}
.sh table{width:100%;border-collapse:collapse}
.sh th{background:#2d2d30;color:#fff;padding:7px 6px;font-size:9pt;text-align:center}.sh th.am{background:#f0b942;color:#222;text-align:left;padding-left:10px;width:44%}
.sh td{padding:7px 6px;text-align:center;font-size:9pt}.sh td:first-child{text-align:left;padding-left:10px}.sh tr:nth-child(even) td{background:#e0e0e1}.sh tr:nth-child(odd) td{background:#e7e7e8}
.sh .pw{white-space:pre-wrap}
.sg{display:flex;gap:25mm;margin-top:auto;padding-top:10mm}.sc{flex:1;text-align:center;font-size:9pt}.sl{height:18mm;display:flex;align-items:flex-end;justify-content:center}.sl img{max-height:17mm;max-width:100%}.sn{border-top:1px solid #333;padding-top:4px}.sh tr,.sg{break-inside:avoid}
.ft{margin-top:6mm;font-size:8.5pt;color:#555}
#print{display:none}
@media print{@page{size:A4;margin:0}body>*{display:none!important}#print{display:block!important}}

function pv(id){const d=S.docs.find(x=>x.id==id);modal('Pré-visualização · '+d.no,`<div id="pz" style="overflow:auto">${sheet(d)}</div>`,{ok:()=>{pr(id);return false},lb:'Imprimir / PDF',cl:'Fechar'});const z=$('#pz'),s=z.firstElementChild;fit(s);s.style.zoom=Math.min(1,z.clientWidth/794)}

const lst=()=>{const s=q.toLowerCase();return S.docs.filter(d=>(flt=='ALL'||d.t==flt)&&(d.no+' '+d.cn).toLowerCase().includes(s)).map(row).join('')||'<p class="mu">Nenhum documento.</p>'};
function vDocs(){return`<div class="cd"><div class="g"><input placeholder="Pesquisar por número ou cliente" value="${E(q)}" oninput="q=this.value;$('#lst').innerHTML=lst()"><select onchange="flt=this.value;$('#lst').innerHTML=lst()"><option value="ALL">Todos os tipos</option>${Object.keys(TY).map(t=>`<option value="${t}"${flt==t?' selected':''}>${TY[t].n}</option>`).join('')}</select></div><div id="lst">${lst()}</div></div>`}
function nw(){modal('Novo documento',`<div class="g">${Object.keys(TY).map(t=>`<button class="b" onclick="nd('${t}')">${TY[t].n}</button>`).join('')}</div>`,{cl:'Fechar'})}
function nd(t){openDoc({id:uid(),t,no:nextNo(t),date:today(),due:'',cn:'',cnu:'',cad:'',ctl:'',items:[{d:'',q:1,p:0}],dc:0,iva:S.cfg.iva,obs:'',pago:false,pay:'Numerário',ref:'',title:TPL[0].t,body:TPL[0].b,val:0,city:S.cfg.cid},true)}
const ed=id=>openDoc(S.docs.find(x=>x.id==id),false);
function conv(id){const d=S.docs.find(x=>x.id==id),t=d.t=='COT'?'FAT':'REC',n=JSON.parse(JSON.stringify(d));Object.assign(n,{id:uid(),t,ref:d.no,date:today(),pago:t=='REC',no:nextNo(t)});openDoc(n,true)}
function del(id){modal('Eliminar','Eliminar este documento?',{ok:()=>{S.docs=S.docs.filter(x=>x.id!=id);save();render()},lb:'Eliminar'})}
function itRows(){$('#it').innerHTML=W.items.map((r,i)=>`<div class="itr"><input placeholder="Descrição | detalhe (opcional)" value="${E(r.d)}" oninput="W.items[${i}].d=this.value"><input type="number" min="0" step="any" value="${r.q}" oninput="W.items[${i}].q=this.value;sm()"><input type="number" min="0" step="any" value="${r.p}" oninput="W.items[${i}].p=this.value;sm()"><button class="x" onclick="W.items.splice(${i},1);if(!W.items.length)W.items.push({d:'',q:1,p:0});itRows()" aria-label="Remover">✕</button></div>`).join('');sm()}
function sm(){const k=calc(W);$('#sm').innerHTML='Subtotal '+m(k.sub)+' · IVA '+m(k.iva)+' · <b>Total '+m(k.tot)+'</b>'}
function openDoc(d,isNew){W=JSON.parse(JSON.stringify(d));const ct=W.t=='CTR',t=W.t;
const lbl=(l,id,v,x='')=>`<label>${l}<input id="${id}" value="${E(v)}" ${x}></label>`;
modal((isNew?'Novo ':'Editar ')+TY[t].n+' · '+W.no,`<datalist id="cl">${S.cli.map(c=>`<option value="${E(c.n)}">`).join('')}</datalist>
<div class="g">${lbl('Data','f_date',W.date,'type="date"')}${t=='REC'?lbl('Ref. factura','f_ref',W.ref):ct?lbl('Cidade','f_city',W.city):lbl(t=='COT'?'Válida até':'Vencimento','f_due',W.due,'type="date"')}</div>
<div class="g">${lbl('Cliente / Outorgante','f_cn',W.cn,'list="cl" onchange="fc(this.value)"')}${lbl('NUIT','f_cnu',W.cnu)}${lbl('Endereço','f_cad',W.cad)}${lbl('Telefone','f_ctl',W.ctl)}</div>
${ct?`<div class="g"><label>Modelo<select onchange="$('#f_title').value=TPL[this.value].t;$('#f_body').value=TPL[this.value].b">${TPL.map((x,i)=>`<option value="${i}">${x.t}</option>`).join('')}</select></label>${lbl('Título','f_title',W.title)}${lbl('Valor do contrato','f_val',W.val,'type="number" min="0" step="any"')}</div>
<label>Texto (use {{CLIENTE}}, {{EMISSOR}}, {{VALOR}}, {{DATA}}, {{CIDADE}})<textarea id="f_body" rows="14">${E(W.body)}</textarea></label>`
:`<div class="mu" style="font-size:.78rem;margin-bottom:4px">Descrição · Qtd · Preço</div><div id="it"></div><button class="b m s" onclick="W.items.push({d:'',q:1,p:0});itRows()">+ Item</button>
<div class="g" style="margin-top:10px"><label>Desconto %<input type="number" min="0" step="any" value="${W.dc}" oninput="W.dc=this.value;sm()"></label><label>IVA %<input type="number" min="0" step="any" value="${W.iva}" oninput="W.iva=this.value;sm()"></label>
${t=='REC'?`<label>Forma de pagamento<select id="f_pay">${['Numerário','M-Pesa','e-Mola','Transferência','Cheque'].map(x=>`<option${W.pay==x?' selected':''}>${x}</option>`).join('')}</select></label>`:''}${t=='FAT'?`<label style="display:flex;gap:8px;align-items:center;margin-top:18px"><input type="checkbox" id="f_pago" style="width:auto"${W.pago?' checked':''}> Factura paga</label>`:''}</div>
<p id="sm"></p><label>Observações<textarea id="f_obs" rows="2">${E(W.obs)}</textarea></label>`}`,{ok:()=>sd(isNew),lb:isNew?'Salvar e ver':'Salvar'});
if(ct)$('select').value=Math.max(0,TPL.findIndex(x=>x.t==W.title));else itRows()}
function fc(v){const c=S.cli.find(x=>x.n==v);if(c){$('#f_cnu').value=c.nuit;$('#f_cad').value=c.ad;$('#f_ctl').value=c.tel}}
function sd(isNew){const g=i=>{const e=$('#'+i);return e?e.value:''};Object.assign(W,{date:g('f_date'),cn:g('f_cn').trim(),cnu:g('f_cnu'),cad:g('f_cad'),ctl:g('f_ctl')});
if(!W.cn){toast('Indique o nome do cliente');return false}
if(W.t=='CTR')Object.assign(W,{title:g('f_title'),val:+g('f_val')||0,body:g('f_body'),city:g('f_city')});
else{if(!W.items.some(r=>r.d.trim())){toast('Adicione pelo menos um item');return false}W.items=W.items.filter(r=>r.d.trim());W.obs=g('f_obs');if(W.t=='REC'){W.pay=g('f_pay');W.ref=g('f_ref')}else W.due=g('f_due');if(W.t=='FAT')W.pago=$('#f_pago').checked}
if(isNew){const y=new Date().getFullYear();W.no=nextNo(W.t);S.seq[W.t+y]=(S.seq[W.t+y]||0)+1;S.docs.unshift(W)}else S.docs[S.docs.findIndex(x=>x.id==W.id)]=W;
const o={n:W.cn,nuit:W.cnu,ad:W.cad,tel:W.ctl},i=S.cli.findIndex(x=>x.n==o.n);i<0?S.cli.push(o):S.cli[i]=o;save();render();const id=W.id;setTimeout(()=>pv(id),0)}
function vCli(){return`<div class="cd"><button class="b" onclick="cm(-1)">+ Novo cliente</button>${S.cli.map((c,i)=>`<div class="row"><div><b>${E(c.n)}</b><br><small>${[c.nuit&&'NUIT '+E(c.nuit),E(c.tel),E(c.ad)].filter(Boolean).join(' · ')}</small></div><div class="ac"><button class="b m s" onclick="cm(${i})">Editar</button><button class="b m s" onclick="dc(${i})" aria-label="Eliminar">✕</button></div></div>`).join('')||'<p class="mu">Os clientes são guardados automaticamente ao emitir documentos.</p>'}</div>`}
function cm(i){const c=i<0?{n:'',nuit:'',ad:'',tel:''}:S.cli[i],f=(l,id,v)=>`<label>${l}<input id="${id}" value="${E(v)}"></label>`;modal(i<0?'Novo cliente':'Editar cliente',`<div class="g">${f('Nome','k_n',c.n)}${f('NUIT','k_u',c.nuit)}${f('Endereço','k_a',c.ad)}${f('Telefone','k_t',c.tel)}</div>`,{ok:()=>{const n=$('#k_n').value.trim();if(!n){toast('Indique o nome');return false}const o={n,nuit:$('#k_u').value,ad:$('#k_a').value,tel:$('#k_t').value};i<0?S.cli.push(o):S.cli[i]=o;save();render()}})}
function dc(i){modal('Eliminar','Eliminar este cliente? Os documentos já emitidos não são afectados.',{ok:()=>{S.cli.splice(i,1);save();render()},lb:'Eliminar'})}
function vCfg(){const c=S.cfg,f=(l,id,v,x='')=>`<label>${l}<input id="${id}" value="${E(v)}" ${x}></label>`;
return`<div class="cd"><div class="g">${f('Nome / Empresa','c_n',c.n)}${f('NUIT','c_nuit',c.nuit)}${f('Endereço','c_ad',c.ad)}${f('Telefone','c_tel',c.tel)}${f('Email','c_em',c.em)}${f('Cidade (contratos)','c_cid',c.cid)}${f('Moeda','c_cur',c.cur)}${f('IVA padrão %','c_iva',c.iva,'type="number" min="0" step="any"')}</div>
<label>Dados bancários / M-Pesa / e-Mola (aparecem em cotações e facturas)<textarea id="c_bk" rows="2">${E(c.bk)}</textarea></label><div class="g" style="margin-top:10px">${f('Rodapé / slogan','c_rod',c.rod)}${f('Desenvolvido por','c_dev',dv())}<label>Logótipo<input type="file" accept="image/*" onchange="logo(this)"></label><label>Assinatura (PNG transparente)<input type="file" accept="image/png" onchange="logo(this,'sig')"></label></div>
${c.logo?`<img src="${c.logo}" alt="Logótipo" style="max-height:60px;display:block;margin-bottom:10px">`:''}${c.sig?`<img src="${c.sig}" alt="Assinatura" style="max-height:60px;display:block;margin-bottom:10px;background:#fff;border:1px solid var(--bd)">`:''}<button class="b" onclick="sc()">Guardar definições</button> <button class="b s" onclick="rs()">Apagar tudo (limpar exemplos)</button> ${c.logo?'<button class="b s" onclick="S.cfg.logo=\'\';save();render()">Remover logótipo</button> ':''}${c.sig?'<button class="b s" onclick="S.cfg.sig=\'\';save();render()">Remover assinatura</button>':''}</div>`}
function rc(){const g=i=>$('#'+i).value;Object.assign(S.cfg,{n:g('c_n').trim(),nuit:g('c_nuit'),ad:g('c_ad'),tel:g('c_tel'),em:g('c_em'),cid:g('c_cid'),cur:g('c_cur').trim()||'MT',iva:+g('c_iva')||0,bk:g('c_bk'),rod:g('c_rod'),dev:g('c_dev')})}
function sc(){rc();save();toast('Definições guardadas');render()}
function logo(inp,k='logo'){const f=inp.files[0];if(!f)return;rc();const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.cfg[k]=c.toDataURL('image/png');save();render()};i.src=r.result};r.readAsDataURL(f)}
function rs(){modal('Apagar tudo','Apagar definições, clientes e documentos (incluindo os exemplos)? Esta acção não pode ser desfeita.',{ok:()=>{S.cfg={n:'',nuit:'',ad:'',tel:'',em:'',bk:'',cur:'MT',iva:16,rod:'',cid:'Maputo',logo:''};S.docs=[];S.cli=[];S.seq={};save();render()},lb:'Apagar tudo'})}
if(NEW){Object.assign(S.cfg,{n:'Kasi Serviços & Comércio, Lda',nuit:'400123456',ad:'Av. 25 de Setembro, nº 120, Maputo',tel:'+258 84 123 4567',em:'geral@kasiservicos.co.mz',bk:'BIM · NIB 0001 0000 1234 5678 9015 1\nM-Pesa: 84 123 4567 (Kasi Serviços)',rod:'Obrigado pela preferência! · Qualidade e compromisso',iva:16});
S.cli=[{n:'Construções Mabote, Lda',nuit:'400765432',ad:'Av. Eduardo Mondlane, 450, Matola',tel:'+258 86 222 3344'},{n:'Maria Fernanda Cossa',nuit:'100987654',ad:'Bairro Polana Cimento, Maputo',tel:'+258 82 765 4321'}];
const mk=o=>Object.assign({id:uid(),due:'',dc:0,iva:16,obs:'',pago:false,pay:'Numerário',ref:'',title:TPL[0].t,body:TPL[0].b,val:0,city:'Maputo'},o),it=(d,q,p)=>({d,q,p}),A=S.cli[0],B=S.cli[1],f=c=>({cn:c.n,cnu:c.nuit,cad:c.ad,ctl:c.tel}),y=new Date().getFullYear();
S.docs=[mk({t:'CTR',no:'CTR-'+y+'/0001',date:'2026-11-20',val:85000,...f(A),items:[]}),mk({t:'REC',no:'REC-'+y+'/0001',date:'2026-11-18',ref:'FAT-'+y+'/0002',pay:'M-Pesa',...f(B),items:[it('Instalação de sistema de câmaras de vigilância (4 câmaras)',1,18500),it('Mão de obra e configuração',1,3500)]}),mk({t:'FAT',no:'FAT-'+y+'/0002',date:'2026-11-15',due:'2026-11-30',pago:true,obs:'Garantia de 12 meses sobre o equipamento.',...f(B),items:[it('Instalação de sistema de câmaras de vigilância (4 câmaras)',1,18500),it('Mão de obra e configuração',1,3500)]}),mk({t:'FAT',no:'FAT-'+y+'/0001',date:'2026-11-10',due:'2026-11-25',dc:5,obs:'Pagamento em 15 dias após emissão.',...f(A),items:[it('Pintura exterior de edifício (m²)',250,320),it('Tinta e material de aplicação',1,24000),it('Transporte de equipamento',1,2500)]}),mk({t:'COT',no:'COT-'+y+'/0001',date:'2026-11-05',due:'2026-12-05',...f(A),items:[it('Pintura exterior de edifício (m²)',250,320),it('Tinta e material de aplicação',1,24000),it('Transporte de equipamento',1,2500)]})];
S.seq={['COT'+y]:1,['FAT'+y]:2,['REC'+y]:1,['CTR'+y]:1};save()}
render();
</script></body></html>
